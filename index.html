<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horario de los gurises</title>
    <link rel="stylesheet" href="./css/estilos.css">
</head>

<body>
    <main class="app-container">
        <header>
            <h1>WorkTracker <span>& Expenses</span></h1>
            <div class="header-actions">
                <button id="btnToggleAdmin" class="btn btn-nav">
                    <span id="btnNavIcon">📊</span> <span id="btnNavText">Ver Historial</span>
                </button>
                <div class="user-selector">
                    <label for="userSelect">Usuario:</label>
                    <select id="userSelect">
                        <option value="Diego">Diego</option>
                        <option value="Nata">Nata</option>
                    </select>
                </div>
            </div>
        </header>

        <div id="mainWorkspace">
            <section class="attendance-card">
                <h2>Asistencia</h2>
                <div class="button-group">
                    <button id="btnIn" class="btn btn-in">Marcar Entrada</button>
                    <button id="btnOut" class="btn btn-out">Marcar Salida</button>
                </div>
            </section>

            <div id="statsGrid" class="stats-grid">
                <!-- Las tarjetas de usuarios se renderizan dinámicamente aquí -->
            </div>

            <section class="expense-card">
                <h2>Registrar Gasto</h2>
                <form id="expenseForm" class="expense-form">
                    <input type="text" id="expConcept" placeholder="Concepto" required>
                    <input type="number" id="expAmount" placeholder="Monto ($)" required>
                    <button type="submit" class="btn btn-save">Guardar Gasto</button>
                </form>
            </section>

            <section class="history-card">
                <h2>Actividad de Hoy</h2>
                <div class="table-wrapper">
                    <table id="historyTable">
                        <thead>
                            <tr>
                                <th>Persona</th>
                                <th>Tipo</th>
                                <th>Detalle</th>
                                <th>Hora</th>
                            </tr>
                        </thead>
                        <tbody id="historyBody"></tbody>
                    </table>
                </div>
            </section>
        </div>

        <div id="adminWorkspace" class="hidden">
            <section class="history-card">
                <div class="admin-header-box">
                    <h2>Historial y Archivo Pasado</h2>
                    <!-- <button id="btnBackToMain" class="btn-link">← Volver a Hoy</button> -->
                </div>

                <div class="filters" style="margin-top: 15px; display: flex; gap: 10px;">
                    <input type="month" id="monthFilter" class="user-selector-input">
                    <select id="userFilter" class="user-selector-input">
                        <option value="Todos">Todos los usuarios</option>
                        <option value="Diego">Diego</option>
                        <option value="Nata">Nata</option>
                    </select>
                </div>

                <div class="table-wrapper" style="margin-top: 20px;">
                    <table>
                        <thead>
                            <tr>
                                <th>Fecha</th>
                                <th>Usuario</th>
                                <th>Evento</th>
                                <th>Detalle</th>
                                <th style="text-align: center;">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="adminHistoryBody"></tbody>
                    </table>
                </div>
            </section>
        </div>
        <!-- MODAL DE CONFIRMACIÓN DE BORRADO -->
        <dialog id="deleteModal" class="modal">
            <div class="modal-content">
                <h3>¿Eliminar registro?</h3>
                <p>Esta acción eliminará el registro permanentemente de la base de datos.</p>
                <div class="modal-actions">
                    <button id="btnCancelDelete" class="btn btn-secondary">Cancelar</button>
                    <button id="btnConfirmDelete" class="btn btn-out">Eliminar</button>
                </div>
            </div>
        </dialog>

        <!-- MODAL DE EDICIÓN DE DETALLE -->
        <dialog id="editModal" class="modal">
            <div class="modal-content">
                <h3>Editar Detalle</h3>
                <input type="text" id="editDetailInput" class="modal-input" placeholder="Nuevo detalle...">
                <div class="modal-actions">
                    <button id="btnCancelEdit" class="btn btn-secondary">Cancelar</button>
                    <button id="btnSaveEdit" class="btn btn-save">Guardar Cambios</button>
                </div>
            </div>
        </dialog>
    </main>
    <script type="module" src="./js/script.js?v=2"></script>
</body>

</html>
